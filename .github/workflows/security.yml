# Security scans that CodeQL doesn't cover. CodeQL itself (Python + the
# workflow files) runs via GitHub's "default setup" in Settings > Code security.
#   - PSScriptAnalyzer: checks the PowerShell installers for risky patterns
#     (e.g. Invoke-Expression on variables, plain-text passwords).
#   - ShellCheck: checks install.sh for quoting bugs and unsafe shell use.
# Findings show up under the repo's Security > Code scanning tab.
name: Security scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * 0"   # weekly, Monday 8am AEDT
permissions:
  contents: read
jobs:
  powershell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed to upload results to Code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: .
          recurse: true
          # samples/ holds deliberately simple preview files for checking colours
          ignorePattern: 'samples'
          output: psscriptanalyzer.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psscriptanalyzer.sarif
          category: psscriptanalyzer
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
