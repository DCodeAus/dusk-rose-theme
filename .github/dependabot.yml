# Dependabot keeps the GitHub Actions used by the workflows up to date and
# opens a pull request when one has a security fix. (This repo has no npm/pip
# dependencies of its own, so Actions is the only thing to watch.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
